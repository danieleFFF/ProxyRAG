x-agent: &agent
  image: proxyrag-app:latest
  build: .
  pull_policy: never
  environment:
    CHROMA_PATH: /app/embeddings/db_gemma
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  volumes:
    - ./embeddings/db_gemma:/app/embeddings/db_gemma
  networks:
    - app-network

services:

  # Django proxy
  proxy:
    image: proxyrag-app:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: >
      sh -c "cd proxy && python manage.py migrate --run-syncdb &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./proxy:/app/proxy
    depends_on:
      - agent-qwen-2b
      - agent-qwen-4b
      - agent-llama-3b
      - agent-llama-1b
    networks:
      - app-network

  # Agent servers: all share the same image, differ only in port/command
  agent-qwen-2b:
    <<: *agent
    ports:
      - "8001:8001"
    command: python proxy/proxy/agent.py --port 8001

  agent-qwen-4b:
    <<: *agent
    ports:
      - "8002:8002"
    command: python proxy/proxy/agent.py --port 8002

  agent-llama-3b:
    <<: *agent
    ports:
      - "8003:8003"
    command: python proxy/proxy/agent.py --port 8003

  agent-llama-1b:
    <<: *agent
    ports:
      - "8004:8004"
    command: python proxy/proxy/agent.py --port 8004

  # OpenWebUI
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    pull_policy: missing
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://proxy:8000/v1
      OPENAI_API_KEY: "dummy"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true" # forces openwebui to user info forwarding
      ENABLE_FORWARD_OAUTH_TOKEN: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true" # shows only user's available models based on his roles
      # OIDC Keycloak
      WEBUI_AUTH: "true"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_PROVIDER_NAME: "Keycloak"
      OAUTH_CLIENT_ID: "open-webui"
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: "http://keycloak:8080/realms/openwebui-realm/.well-known/openid-configuration"
      WEBUI_URL: "http://localhost:3000"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - proxy
    networks:
      - app-network

  # Keycloak (authentication)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    pull_policy: missing
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  keycloak_data:
  open-webui:
    external: true
